[project]
name = "labourlens"
version = "0.1.0"
description = "LabourLens: evidence-grounded Singapore labour-market research assistant (data ingestion, hybrid retrieval, bounded LangGraph agent, MCP server, evaluation harness and web workbench)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas>=2.2,<3",
  "pyarrow>=17",
  "duckdb>=1.1,<2",
  "pymupdf>=1.24,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pyyaml>=6",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "matplotlib>=3.9",
  "bm25s>=0.3.16",
  "pystemmer>=3.1.0",
  "langgraph>=1.2.18",
  "mcp>=2.3.0",
  "cryptography<49",
  "fastapi>=0.162.0",
  "uvicorn>=0.54.0",
  "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff==0.16.1",
]

[project.scripts]
labourlens = "labourlens.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labourlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["corpus: requires locally acquired source corpus or built data artifacts"]

[tool.ruff]
line-length = 160
target-version = "py312"
extend-exclude = ["data", "private", "web"]

[tool.ruff.lint]
# Correctness only: pyflakes, syntax errors, import order is not enforced (would reformat the whole repository).
select = ["F", "E9"]
