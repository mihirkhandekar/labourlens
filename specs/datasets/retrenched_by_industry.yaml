source_id: retrenched_by_industry
adapter: quarterly_long_dimension
period_col: quarter
expected_columns:
- quarter
- industry
- retrench
measures:
- column: retrench
  indicator_id: retrenched_employees_by_industry
  unit: persons
  population: establishments
  adjustment: not_applicable
  definition: Retrenched employees by industry (values rounded to the nearest 10 in the source; '-' marks cells the publisher does not publish a number for). Industry names changed over time with SSIC revisions;
    the hierarchy below applies to the 2024-Q1 to 2026-Q2 window. Labour Market Survey of establishments (MRSD, MOM). From 2006 the scope includes the public sector.
  plausible_range:
  - 0
  - 12000
expected_first_period: 1998-Q1
expected_last_period: 2026-Q2
missing_tokens:
- na
- '-'
