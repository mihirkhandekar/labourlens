source_id: resignation_rate_by_industry
adapter: quarterly_long
period_col: quarter
expected_columns:
- quarter
- industry
- resignation_rate
dimension_col: industry
measures:
- column: resignation_rate
  indicator_id: resignation_rate_by_industry
  unit: percent
  population: establishments
  adjustment: unspecified
  definition: 'Average Monthly Resignation Rate by Industry - Quarterly. Average Monthly Resignation Rate during a quarter is defined as the average number of persons who resigned in
    a month during the quarter divided by the average number of employees in the establishment. The annual figures are the simple averages of the quarterly figures

    Source: Labour Market Survey, Manpower Research & Statistics Department, MOM

    Before 2006, data pertain to private sector establishments (each with at least 25 employees). From 2006 onwards, it also includes

    the public sector. The dataset description does not state seasonal-adjustment status. Dimension labels are preserved as published; categories may include aggregates and must not
    be summed without a verified hierarchy.'
  plausible_range:
  - 0
  - 10
expected_first_period: 1998-Q1
expected_last_period: 2026-Q2
